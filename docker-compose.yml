services:
  blog-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: my-blog-dev
    ports:
      - "4321:4321"
    working_dir: /app
    volumes:
      - ./:/app
      - blog_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CI=true
    command: sh -c "pnpm install && pnpm run dev -- --host 0.0.0.0 --port 4321"
    restart: unless-stopped

volumes:
  blog_node_modules:
