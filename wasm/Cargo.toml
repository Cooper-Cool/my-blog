[workspace]
members = [
    "geo",
]
resolver = "2"

[workspace.dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde-wasm-bindgen = "0.6.5"
geojson = "0.24.2"
geo = "0.26"
geo-types = "0.7.16"
js-sys = "0.3.77"
kdtree = "0.7"
wee_alloc = "0.4.5"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
overflow-checks = false
